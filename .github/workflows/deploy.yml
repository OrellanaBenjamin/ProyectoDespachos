name: CI/CD Deploy

on:
  push:
    branches:
      - deploy

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
 
 
      - name: Build frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/front_despacho:latest ./front_despacho

      - name: Push frontend
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/front_despacho:latest

      - name: Build backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/back-despachos_springBoot:latest ./back-despachos_springBoot

      - name: Push backend
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/back-despachos_springBoot:latest

      - name: Build backendend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/back-ventas_springBoot:latest ./back-ventas_springBoot

      - name: Push backendend
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/back-ventas_springBoot:latest